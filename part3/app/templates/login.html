<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HBnB — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 380px;
      text-align: center;
    }
    .card svg { margin-bottom: 1rem; }
    .card h1 { font-size: 22px; font-weight: 500; margin-bottom: 2rem; color: #1a1a1a; }
    input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: #7F77DD; }
    button {
      width: 100%;
      height: 42px;
      background: #7F77DD;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover { background: #6b63cc; }
  </style>
</head>
<body>
<div class="card">
  <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
    <rect x="10" y="24" width="32" height="22" rx="5" fill="#7F77DD"/>
    <path d="M17 24V18a9 9 0 0 1 18 0v6" stroke="#7F77DD" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="26" cy="34" r="3" fill="white"/>
    <line x1="26" y1="36" x2="26" y2="41" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <h1>Sign in to HBnB</h1>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />
  <button onclick="login()">
    <svg width="16" height="16" viewBox="0 0 52 52" fill="none">
      <rect x="10" y="24" width="32" height="22" rx="5" fill="white"/>
      <path d="M17 24V18a9 9 0 0 1 18 0v6" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="26" cy="34" r="3" fill="#7F77DD"/>
      <line x1="26" y1="36" x2="26" y2="41" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    Login
  </button>
</div>
<script>
  async function login() {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('access_token', data.access_token);
      window.location.href = '/api/v1/';
    } else {
      alert(data.error || 'Invalid credentials');
    }
  }
</script>
</body>
</html>
