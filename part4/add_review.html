<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add Review - HBnB">
    <title>Add Review - HBnB</title>
    <link rel="icon" type="image/svg+xml" href="images/icon.svg">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="images/logo.svg" alt="HBnB Logo" class="logo">
                <h1>HBnB</h1>
            </div>
            <nav>
                <a href="index.html" class="nav-link">Home</a>
            </nav>
        </div>
    </header>
 
    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="form-container">
                <h1>Add Your Review</h1>
                <p class="subtitle">Share your experience with other travelers</p>
 
                <!-- Success/Error Messages -->
                <div id="message-container" style="display: none;"></div>
 
                <!-- Review Form -->
                <form id="review-form" class="add-review form">
                    <div class="form-group">
                        <label for="rating">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                            </svg>
                            Rating
                        </label>
                        <select id="rating" name="rating" required class="form-control">
                            <option value="">Select your rating</option>
                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            <option value="4">⭐⭐⭐⭐ Very Good</option>
                            <option value="3">⭐⭐⭐ Good</option>
                            <option value="2">⭐⭐ Fair</option>
                            <option value="1">⭐ Poor</option>
                        </select>
                    </div>
 
                    <div class="form-group">
                        <label for="comment">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                            </svg>
                            Your Review
                        </label>
                        <textarea 
                            id="comment" 
                            name="comment" 
                            rows="6" 
                            placeholder="Tell us about your experience at this place. What did you like? What could be improved?"
                            required
                            maxlength="1000"
                            class="form-control"
                        ></textarea>
                        <small class="form-text">
                            <span id="char-count">0</span>/1000 characters
                        </small>
                    </div>
 
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.history.back()">
                            Cancel
                        </button>
                        <button type="submit" class="btn-submit">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                            </svg>
                            Submit Review
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
 
    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <p>&copy; 2024 HBnB. All rights reserved.</p>
        </div>
    </footer>
 
    <script src="scripts/scripts.js"></script>
    <script src="scripts/add_review.js"></script>
</body>
</html>
